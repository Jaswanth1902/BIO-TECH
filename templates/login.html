{% extends "base.html" %}

{% block title %}Portal Login - Bio-Tech Traceability{% endblock %}

{% block content %}
<section class="page-section fade-in login-section">
    <article>
        <header>
            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
            <h2>Secure Portal Login</h2>
            <p class="text-muted">Access the Traceability Control Center</p>
        </header>

        <form action="{{ url_for('login') }}" method="post">
            <label for="username">
                Username
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </label>
            
            <label for="password">
                Password
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </label>
            
            <button type="submit" class="primary-btn full-width" style="margin-top: 1rem;">
                Authenticate Session <i class="fa-solid fa-key" style="margin-left: 8px;"></i>
            </button>
        </form>

        <footer class="login-footer">
            <p class="text-muted">
                Authorized personnel only. Sessions are logged on-chain.
            </p>
        </footer>
    </article>
</section>
{% endblock %}
