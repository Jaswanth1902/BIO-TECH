<!-- Floating AI Chat Widget -->
<div id="ai-chat-widget" class="chat-widget">
    <!-- Pulsing FAB Button to toggle -->
    <button type="button" class="chat-widget-fab" onclick="toggleChatWidget()" aria-label="Toggle AI Assistant">
        <i class="fa-solid fa-robot"></i>
        <span class="fab-pulse"></span>
    </button>
    
    <!-- Expanded Chat Drawer -->
    <div class="chat-widget-drawer">
        <header class="card-header">
            <button type="button" class="close-btn" onclick="toggleChatWidget()" aria-label="Close Chat">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="card-header-title">
                <i class="fa-solid fa-robot"></i>
                <strong>Bio-Tech AI Assistant</strong>
            </div>
        </header>

        <div id="chat-history">
            <p class="ai-msg">
                <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--brand-teal); margin-right: 6px;"></i> 
                Hello! I am your <strong>Bio-Tech Traceability Assistant</strong>. I can help with preservation tips, batch status, or regulatory guidelines. How can I assist you?
            </p>
        </div>

        <!-- Quick Actions Panel -->
        <div class="chat-quick-actions">
            <button type="button" onclick="submitQuickQuery('How to store Tulsi?')" class="contrast outline">🌿 How to store Tulsi?</button>
            <button type="button" onclick="submitQuickQuery('Check Vaccine Guidelines')" class="contrast outline">💉 Check Vaccine Guidelines</button>
            <button type="button" onclick="submitQuickQuery('Audit BSL-4 Protocol')" class="contrast outline">☣️ Audit BSL-4 Protocol</button>
            <button type="button" onclick="submitQuickQuery('How many batches do we have?')" class="contrast outline">📊 Check total batches</button>
        </div>

        <form id="chat-form" onsubmit="event.preventDefault(); sendChatMessage();">
            <div class="chat-form-row">
                <input type="text" id="chat-input" placeholder="Query knowledge base (e.g. 'how to store herb extracts')..." required autocomplete="off">
                <button type="submit" class="primary-btn" aria-label="Send message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>
</div>
